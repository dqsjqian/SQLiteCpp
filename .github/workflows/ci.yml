name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GCC and Clang, both build types, plus Clang with libc++.
  linux:
    name: linux-${{ matrix.compiler }}-${{ matrix.build_type }}${{ matrix.stdlib == 'libc++' && '-libcxx' || '' }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-13, gcc-14, clang-17, clang-18]
        build_type: [Release]
        stdlib: [default]
        include:
          - compiler: clang-18
            build_type: Debug
            stdlib: default
          - compiler: clang-18
            build_type: Release
            stdlib: libc++
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: |
          sudo apt-get update
          case "${{ matrix.compiler }}" in
            gcc-13) sudo apt-get install -y g++-13; echo "CXX=g++-13" >> "$GITHUB_ENV" ;;
            gcc-14) sudo apt-get install -y g++-14; echo "CXX=g++-14" >> "$GITHUB_ENV" ;;
            clang-17) sudo apt-get install -y clang-17; echo "CXX=clang++-17" >> "$GITHUB_ENV" ;;
            clang-18) sudo apt-get install -y clang-18; echo "CXX=clang++-18" >> "$GITHUB_ENV" ;;
          esac
          if [ "${{ matrix.stdlib }}" = "libc++" ]; then
            sudo apt-get install -y libc++-18-dev libc++abi-18-dev
            echo "CXX_EXTRA_FLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: >-
          cmake -S . -B build -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS="$CXX_EXTRA_FLAGS"
          -DCMAKE_EXE_LINKER_FLAGS="$CXX_EXTRA_FLAGS"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install and verify a downstream consumer
        if: matrix.compiler == 'gcc-14' && matrix.build_type == 'Release'
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S tests/installed -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer --parallel 4
          ctest --test-dir build-consumer --output-on-failure

  # Every warning is an error under both GCC and Clang.
  strict-warnings:
    name: strict-warnings-${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-14, clang-18]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "gcc-14" ]; then
            sudo apt-get install -y g++-14
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y clang-18
            echo "CXX=clang++-18" >> "$GITHUB_ENV"
          fi
      - name: Configure with -Werror
        run: >-
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Every public header must compile on its own.
  headers:
    name: header-self-containment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
      - name: Compile each header in isolation
        run: |
          set -e
          status=0
          headers=$(ls include/SQLiteCpp.h include/SQLiteCpp/*.h include/SQLiteCpp/detail/*.h)
          for header in $headers; do
            case "$header" in
              include/SQLiteCpp/sqlcipher.h) continue ;;  # needs the SQLCipher extension
            esac
            printf '#include <%s>\nint main() { return 0; }\n' "${header#include/}" > /tmp/header_check.cc
            if ! g++-14 -std=c++23 -Iinclude -Ivendor/sqlite -Wall -Wextra -Werror \
                 -fsyntax-only /tmp/header_check.cc; then
              echo "header is not self-contained: $header"
              status=1
            fi
          done
          exit $status

  macos:
    name: macos-appleclang
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install and verify a downstream consumer
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S tests/installed -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer --parallel 4
          ctest --test-dir build-consumer --output-on-failure

  windows:
    name: windows-${{ matrix.toolset }}
    strategy:
      fail-fast: false
      matrix:
        toolset: [MSVC, ClangCL]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: >-
          cmake -S . -B build -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -T ${{ matrix.toolset }}
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S . -B build -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
