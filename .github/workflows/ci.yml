name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORGEDEPS_HOME: ${{ github.workspace }}/.forgedeps-workspace
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install -r requirements-build.txt
      - name: Initialise the shared workspace
        # FORGEDEPS_HOME is explicit, so it must exist before any command
        # resolves the locked environment inside it.
        run: python -m forgedeps init "${{ env.FORGEDEPS_HOME }}"
      - name: Build locked SQLite in ForgeDeps
        run: >-
          python -m forgedeps environment --file dependencies.json
          --project-config scripts/dependency_config.py --output sqlite-environment.json
          --build-config Release
      - name: Configure, build and run under a dependency lease
        run: python scripts/check.py

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S . -B build-asan -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan -j4
      - name: Run the suite under the sanitizers
        run: ctest --test-dir build-asan --output-on-failure
