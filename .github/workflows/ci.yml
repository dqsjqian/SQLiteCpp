name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Toolchain policy: every compiler is the newest stable release.
#
#   GCC 16      official gcc:16 image (GCC 16.2, built from the release tarball)
#   LLVM 23     apt.llvm.org on Linux, the LLVM release MSI on Windows
#   MSVC        Visual Studio 2026 on windows-latest
#   AppleClang  newest released Xcode installed on macos-latest
#   Android     newest NDK on the image (r30)
#   MinGW-w64   MSYS2 UCRT64, packages updated at job start
#
# Bumping a major version: change GCC_VERSION together with every `gcc:` image
# tag below (the setup script fails if they disagree), or LLVM_VERSION together
# with LLVM_WINDOWS_RELEASE.
env:
  GCC_VERSION: "16"
  LLVM_VERSION: "23"
  LLVM_WINDOWS_RELEASE: "23.1.4"
  # Warnings are errors on every toolchain: -Wall -Wextra -Wpedantic -Werror for
  # GCC/Clang, /W4 /WX /permissive- for MSVC and clang-cl.
  STRICT: -DSQLITECPP_WARNINGS_AS_ERRORS=ON
  # Retries and timeouts keep a slow mirror from stalling a job.
  APT: sudo apt-get -y -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300

jobs:
  # GCC 16 on x86-64: tests, header self-containment, install + downstream consumer.
  linux-gcc:
    name: linux-gcc-Release
    runs-on: ubuntu-latest
    container: gcc:16
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up GCC
        run: .github/scripts/setup-gcc-container.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON $STRICT -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -- -k 0
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Every public header compiles on its own
        run: .github/scripts/check-headers.sh "$CXX"
      - name: Install and verify a downstream consumer
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S tests/installed -B build-consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer -- -k 0
          ctest --test-dir build-consumer --output-on-failure

  # Clang 23 on x86-64: both build types, libstdc++ and libc++.
  linux-clang:
    name: linux-clang-${{ matrix.build_type }}${{ matrix.stdlib == 'libc++' && '-libcxx' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build_type: Release, stdlib: default }
          - { build_type: Debug, stdlib: default }
          - { build_type: Release, stdlib: libc++ }
    steps:
      - uses: actions/checkout@v7
      - name: Set up LLVM
        run: .github/scripts/install-llvm.sh ${{ matrix.stdlib == 'libc++' && 'libcxx' || '' }}
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON $STRICT
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          ${{ matrix.stdlib == 'libc++' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++' || '' }}
      - name: Build
        run: cmake --build build -- -k 0
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Every public header compiles on its own
        if: matrix.build_type == 'Release' && matrix.stdlib == 'default'
        run: .github/scripts/check-headers.sh "$CXX"

  # Native 64-bit ARM Linux with GCC 16: build and run the suite on real
  # hardware. There is no ubuntu-latest-arm alias; 26.04 is the newest ARM image.
  linux-arm64:
    name: linux-arm64-gcc
    runs-on: ubuntu-26.04-arm
    container: gcc:16
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up GCC
        run: .github/scripts/setup-gcc-container.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON $STRICT -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -- -k 0
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macos-appleclang
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: .github/scripts/select-xcode.sh
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON $STRICT -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install and verify a downstream consumer
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S tests/installed -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer --parallel
          ctest --test-dir build-consumer --output-on-failure

  # iOS simulator (arm64). The executables target iOS, so this job verifies
  # that the library and every test compile and link for the platform.
  ios:
    name: ios-simulator-arm64
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: |
          .github/scripts/select-xcode.sh
          echo "iOS simulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"
      - name: Configure for the iOS simulator
        run: >-
          cmake -S . -B build -DBUILD_TESTING=ON $STRICT
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
      - name: Build
        run: cmake --build build --parallel

  # Android with the newest NDK on the image, 64-bit and 32-bit ARM. The
  # executables target Android: compile and link verification.
  android:
    name: android-ndk-${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v7
      - name: Show the NDK
        run: grep Pkg.Revision "$ANDROID_NDK_LATEST_HOME/source.properties"
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON $STRICT
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=${{ matrix.abi }}
          -DANDROID_PLATFORM=android-24
      - name: Build
        run: cmake --build build -- -k 0

  # Visual Studio 2026 MSVC on x64 (windows-latest) and native ARM64 (no
  # -latest alias; the newest ARM image with VS 2026).
  windows-msvc:
    name: windows-MSVC-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-vs2026-arm }
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON $env:STRICT
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # clang-cl from the LLVM 23 release (Visual Studio bundles an older Clang),
  # against the Visual Studio 2026 headers and libraries.
  windows-clang-cl:
    name: windows-clang-cl-x64
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Set up LLVM
        run: |
          $release = $env:LLVM_WINDOWS_RELEASE
          if (-not $release.StartsWith("$env:LLVM_VERSION.")) {
            throw "LLVM_WINDOWS_RELEASE $release does not match LLVM_VERSION $env:LLVM_VERSION"
          }
          $msi = Join-Path $env:RUNNER_TEMP "LLVM-$release-win64.msi"
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 10 -OutFile $msi `
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$release/LLVM-$release-win64.msi"
          # Administrative install: unpack only, so the LLVM preinstalled on the
          # image is neither replaced nor picked up by accident.
          $target = Join-Path $env:RUNNER_TEMP 'llvm'
          $unpack = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$target`"")
          if ($unpack.ExitCode -ne 0) { throw "msiexec exited with $($unpack.ExitCode)" }
          $clang = Get-ChildItem $target -Recurse -Filter clang-cl.exe | Select-Object -First 1
          if (-not $clang) { throw 'clang-cl.exe not found in the LLVM package' }
          & $clang.FullName --version
          "CLANG_CL=$($clang.FullName -replace '\\', '/')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON $env:STRICT
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=$env:CLANG_CL" "-DCMAKE_CXX_COMPILER=$env:CLANG_CL"
      - name: Build
        run: cmake --build build -- -k 0
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # MinGW-w64 (GCC, UCRT runtime) from MSYS2, running natively on Windows.
  mingw:
    name: windows-mingw-ucrt64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure, build and test
        shell: msys2 {0}
        run: |
          g++ --version | head -1
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON $STRICT -DCMAKE_BUILD_TYPE=Release
          cmake --build build -- -k 0
          ctest --test-dir build --output-on-failure

  # AddressSanitizer + UndefinedBehaviorSanitizer with GCC 16. LeakSanitizer
  # stops threads through ptrace, which a container only allows with the
  # capability below.
  sanitizers:
    name: asan-ubsan
    runs-on: ubuntu-latest
    container:
      image: gcc:16
      options: --cap-add=SYS_PTRACE
    timeout-minutes: 30
    env:
      SAN: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
    steps:
      - uses: actions/checkout@v7
      - name: Set up GCC
        run: .github/scripts/setup-gcc-container.sh
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON $STRICT
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="$SAN" -DCMAKE_CXX_FLAGS="$SAN"
          -DCMAKE_EXE_LINKER_FLAGS="$SAN"
      - name: Build
        run: cmake --build build -- -k 0
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # One connection shared by several threads (tests/concurrency.cc) plus the
  # whole suite under ThreadSanitizer, with Clang 23.
  tsan:
    name: tsan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TSAN: -fsanitize=thread -fno-omit-frame-pointer
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v7
      - name: Set up LLVM
        run: .github/scripts/install-llvm.sh runtime
      - name: Keep ASLR entropy within what ThreadSanitizer supports
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON $STRICT
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="$TSAN" -DCMAKE_CXX_FLAGS="$TSAN"
          -DCMAKE_EXE_LINKER_FLAGS="$TSAN"
      - name: Build
        run: cmake --build build -- -k 0
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Line coverage of include/ with GCC 16 and lcov.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    container: gcc:16
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up GCC and lcov
        run: .github/scripts/setup-gcc-container.sh lcov
      - name: Build and test with coverage instrumentation
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DSQLITECPP_COVERAGE=ON
          cmake --build build -- -k 0
          ctest --test-dir build --output-on-failure
      - name: Report
        run: |
          lcov --gcov-tool "$GCOV_TOOL" --capture --directory build --output-file coverage.info \
            --ignore-errors mismatch,inconsistent,unused,negative
          lcov --gcov-tool "$GCOV_TOOL" --extract coverage.info '*/include/SQLiteCpp/*' '*/include/SQLiteCpp.h' \
            --output-file coverage.info --ignore-errors unused
          lcov --summary coverage.info | tee coverage-summary.txt
          {
            echo '### Coverage of include/'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # clang-tidy 23, a short fuzz run and the API docs. Each step fails the job
  # on its own; none of them only prints.
  quality:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Set up LLVM
        run: .github/scripts/install-llvm.sh tidy runtime
      - name: Install Doxygen
        run: |
          $APT update
          $APT install doxygen
      - name: clang-tidy (every finding is an error, see .clang-tidy)
        run: |
          "$CLANG_TIDY" --version | head -2
          cmake -S . -B build-tidy -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          for source in tests/maintenance_regression.cpp tests/concurrency.cc benchmarks/benchmark.cc fuzz/fuzz_sql.cc; do
            echo "::group::clang-tidy $source"
            "$CLANG_TIDY" -p build-tidy "$source"
            echo "::endgroup::"
          done
      - name: Fuzz the SQL front end for 60 seconds
        run: |
          cmake -S . -B build-fuzz -G Ninja -DBUILD_TESTING=ON -DSQLITECPP_BUILD_FUZZERS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
          cmake --build build-fuzz --target sqlitecpp_fuzz_sql
          mkdir -p fuzz-run && cd fuzz-run
          ../build-fuzz/sqlitecpp_fuzz_sql -max_total_time=60 -timeout=10 -rss_limit_mb=2048 -print_final_stats=1
      - name: API docs
        run: |
          cd docs
          doxygen Doxyfile
          test -f doxygen/html/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: docs/doxygen/html
          retention-days: 7
