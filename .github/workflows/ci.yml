name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Latest GCC and Clang, both build types, both standard libraries.
  # Every build is also a strict-warning build: warnings are errors here.
  linux:
    name: linux-${{ matrix.compiler }}-${{ matrix.build_type }}${{ matrix.stdlib == 'libc++' && '-libcxx' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc-14, build_type: Release, stdlib: default }
          - { compiler: clang-18, build_type: Release, stdlib: default }
          - { compiler: clang-18, build_type: Debug, stdlib: default }
          - { compiler: clang-18, build_type: Release, stdlib: libc++ }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "gcc-14" ]; then
            sudo apt-get install -y g++-14
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y clang-18
            echo "CXX=clang++-18" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.stdlib }}" = "libc++" ]; then
            sudo apt-get install -y libc++-18-dev libc++abi-18-dev
            echo "CXX_EXTRA_FLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: >-
          cmake -S . -B build -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror $CXX_EXTRA_FLAGS"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install and verify a downstream consumer
        if: matrix.compiler == 'gcc-14' && matrix.build_type == 'Release'
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S tests/installed -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer --parallel 4
          ctest --test-dir build-consumer --output-on-failure

  # Every public header must compile on its own.
  headers:
    name: header-self-containment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
      - name: Compile each header in isolation
        run: |
          set -e
          status=0
          headers=$(ls include/SQLiteCpp.h include/SQLiteCpp/*.h include/SQLiteCpp/detail/*.h)
          for header in $headers; do
            case "$header" in
              include/SQLiteCpp/sqlcipher.h) continue ;;  # needs the SQLCipher extension
            esac
            printf '#include <%s>\nint main() { return 0; }\n' "${header#include/}" > /tmp/header_check.cc
            if ! g++-14 -std=c++23 -Iinclude -Ivendor/sqlite -Wall -Wextra -Werror \
                 -fsyntax-only /tmp/header_check.cc; then
              echo "header is not self-contained: $header"
              status=1
            fi
          done
          exit $status

  macos:
    name: macos-appleclang
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install and verify a downstream consumer
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S tests/installed -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer --parallel 4
          ctest --test-dir build-consumer --output-on-failure

  windows:
    name: windows-${{ matrix.toolset }}
    strategy:
      fail-fast: false
      matrix:
        toolset: [MSVC, ClangCL]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release)
          if [ "${{ matrix.toolset }}" = "ClangCL" ]; then
            args+=(-T ClangCL)
          fi
          cmake "${args[@]}"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # MinGW-w64 (GCC on Windows, UCRT64 runtime). Runs natively on the runner.
  mingw:
    name: windows-mingw-ucrt64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Show the compiler
        shell: msys2 {0}
        run: g++ --version | head -1
      - name: Configure, build and test
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
          cmake --build build
          ctest --test-dir build --output-on-failure

  sanitizers:
    name: asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S . -B build -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Apple platform: cross-compile for the iOS simulator (arm64). The test
  # executable targets iOS and is compile-verified, not run on the host.
  ios:
    name: ios-simulator-arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Configure for the iOS simulator
        run: >-
          cmake -S . -B build -DBUILD_TESTING=ON
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
      - name: Build
        run: cmake --build build --parallel 4

  # Android: compile with the NDK for both 64-bit and 32-bit ARM. The test
  # executable targets Android and is compile-verified, not run on the host.
  android:
    name: android-ndk-${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Show the NDK in use
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $ndk"
          cat "$ndk/source.properties"
      - name: Configure with the Android NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cmake -S . -B build -DBUILD_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24
      - name: Build
        run: cmake --build build --parallel 4

  # 64-bit ARM Linux, cross-compiled (covers embedded and single-board targets).
  linux-arm64:
    name: linux-arm64-cross
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu
      - name: Configure
        run: >-
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=aarch64
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
      - name: Build
        run: cmake --build build --parallel 4

  # Static analysis, coverage, a short fuzz run and the API docs.
  quality:
    name: quality-gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 lcov doxygen
      - name: Configure (clang, compile commands on)
        run: >-
          cmake -S . -B build-q -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build-q --parallel 4
      - name: clang-tidy on the regression target
        run: |
          clang-tidy-18 -p build-q tests/maintenance_regression.cpp 2>&1 | tee tidy.log
          ! grep -q "error:" tidy.log
      - name: Coverage
        run: |
          cmake -S . -B build-cov -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
            -DSQLITECPP_COVERAGE=ON -DCMAKE_CXX_FLAGS="--coverage"
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build-cov --parallel 4
          ctest --test-dir build-cov --output-on-failure
          lcov --capture --directory build-cov --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '*/vendor/*' '*/tests/*' --output-file coverage.info
          lcov --summary coverage.info
      - name: Short fuzz run
        run: |
          cmake -S . -B build-fuzz -DBUILD_TESTING=ON -DSQLITECPP_BUILD_FUZZERS=ON
            -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_C_COMPILER=clang-18
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
          cmake --build build-fuzz --target sqlitecpp_fuzz_sql --parallel 4
          ./build-fuzz/sqlitecpp_fuzz_sql -max_total_time=30 -print_final_stats=1
      - name: API docs
        run: |
          cd docs && doxygen Doxyfile
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/doxygen/html
          retention-days: 7
